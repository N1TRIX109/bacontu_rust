[package]
name = "fidelity_rs"
version = "0.1.0"
edition = "2021"
description = "Порт лобби и Waybackyard (whatsshakinbacon / Fidelity Hotel) с GameMaker на Rust"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
